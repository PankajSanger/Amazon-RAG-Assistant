services:
  app:
    build:
      context: .
      secrets:
        - guardrails_token
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./chroma_store:/app/chroma_store
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

secrets:
  guardrails_token:
    environment: GUARDRAILS_TOKEN
